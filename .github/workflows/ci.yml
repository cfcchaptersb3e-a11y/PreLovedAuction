name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    name: Build and check
    runs-on: ubuntu-latest

    # The auction rules are checked against a real Postgres, since they rely on
    # serializable transactions rather than anything an in-memory fake models.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: preloved_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/preloved_ci
      # Throwaway value: sessions are never issued during CI, but the app
      # refuses to start without it.
      AUTH_SECRET: ci-only-secret-not-used-anywhere-real

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create the database schema
        run: npx prisma db push --skip-generate

      - name: Build
        run: npm run build

      - name: Check the auction rules
        run: npm run check
